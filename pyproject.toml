[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-rebench-harness"
version = "0.2.0"
description = "A reproducible multi-agent SWE-rebench benchmark harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2",
]

[project.scripts]
rebench = "rebench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
